server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Hasta 20 archivos por envío (25 MB cada uno como máximo)
  client_max_body_size 120m;

  add_header X-Content-Type-Options nosniff always;
  # SAMEORIGIN: el visor de adjuntos muestra los PDF dentro de la propia aplicación
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy same-origin always;

  location /api/ {
    proxy_pass http://api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Aplicación de una sola página: toda ruta desconocida carga index.html
  location / {
    try_files $uri /index.html;
  }
}
