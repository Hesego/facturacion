version: "3.7"

# Stack de Portainer (Docker Swarm) del flujo de gastos · Hesego Ingeniería S.A.S.
# Pegue este archivo en Portainer → Stacks → Add stack y defina las variables de entorno
# listadas en docs/despliegue.md. Las imágenes las publica .github/workflows/docker-publish.yml.
#
# Todos los servicios llevan el prefijo fact- porque en la red compartida hesegonet cada
# servicio se resuelve por su nombre corto y no debe chocar con los de otros stacks.

services:

## --------------------------- FACTURACIÓN --------------------------- ##

  # Interfaz web (nginx). Es lo único publicado en Traefik: reenvía /api a fact-api.
  fact-web:
    image: ${DOCKERHUB_NAMESPACE}/facturacion-web:latest

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    networks:
      - hesegonet

    environment:
      - API_UPSTREAM=fact-api:3000

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
      labels:
        - traefik.enable=true
        - traefik.http.routers.facturacion-app.rule=Host(`facturacion.devops.hesegoingenieria.com`)
        - traefik.http.services.facturacion-app.loadbalancer.server.port=8080
        - traefik.http.routers.facturacion-app.service=facturacion-app
        - traefik.http.routers.facturacion-app.tls.certresolver=letsencryptresolver
        - traefik.http.routers.facturacion-app.entrypoints=websecure
        - traefik.http.routers.facturacion-app.tls=true

  # API. Se conecta con el rol gastos_app, que no puede editar ni borrar el historial.
  fact-api:
    image: ${DOCKERHUB_NAMESPACE}/facturacion-api:latest

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro

    networks:
      - hesegonet

    environment:
      - TZ=America/Bogota
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgres://gastos_app:${GASTOS_APP_PASSWORD}@fact-db:5432/gastos
      - APP_URL=https://facturacion.devops.hesegoingenieria.com
    ## 📦 Almacenamiento de soportes (MinIO de este stack)
      - S3_ENDPOINT=http://fact-minio:9000
      - S3_BUCKET=gastos-soportes
      - S3_ACCESS_KEY=gastos-app
      - S3_SECRET_KEY=${S3_SECRET_KEY}
    ## 🔔 Notificaciones (n8n de este stack)
      - N8N_WEBHOOK_BASE=http://fact-n8n:5678/webhook
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN}
    ## 🔐 Sesión (HTTPS por Traefik)
      - SESION_HORAS=10
      - COOKIE_SECURE=true

    deploy:
      mode: replicated
      replicas: 1
      # Reintenta mientras fact-init termina las migraciones
      restart_policy:
        condition: on-failure
        delay: 10s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 512M

  # Migraciones, semillas y bucket de MinIO. Corre en cada despliegue y termina (estado Complete).
  fact-init:
    image: ${DOCKERHUB_NAMESPACE}/facturacion-init:latest

    networks:
      - hesegonet

    environment:
      - PGHOST=fact-db
      - PGDATABASE=gastos
      - PGUSER=gastos_owner
      - PGPASSWORD=${GASTOS_OWNER_PASSWORD}
    ## 🌱 Semillas
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_NOMBRE=${ADMIN_NOMBRE:-Administrador del sistema}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SEED_DEMO=${SEED_DEMO:-false}
      - DEMO_PASSWORD=${DEMO_PASSWORD:-}
    ## 📦 MinIO
      - MINIO_URL=http://fact-minio:9000
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - S3_BUCKET=gastos-soportes
      - S3_ACCESS_KEY=gastos-app
      - S3_SECRET_KEY=${S3_SECRET_KEY}

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  # PostgreSQL. Crea roles y bases la primera vez que el volumen está vacío.
  fact-db:
    image: ${DOCKERHUB_NAMESPACE}/facturacion-db:latest

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - facturacion_db_data:/var/lib/postgresql/data

    networks:
      - hesegonet

    environment:
      - TZ=America/Bogota
      - PGTZ=America/Bogota
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_SUPERUSER_PASSWORD}
      - GASTOS_OWNER_PASSWORD=${GASTOS_OWNER_PASSWORD}
      - GASTOS_APP_PASSWORD=${GASTOS_APP_PASSWORD}
      - GASTOS_N8N_PASSWORD=${GASTOS_N8N_PASSWORD}
      - N8N_DB_PASSWORD=${N8N_DB_PASSWORD}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

  # Almacenamiento de los soportes (bucket privado con versionado)
  fact-minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - facturacion_minio_data:/data

    networks:
      - hesegonet

    environment:
      - TZ=America/Bogota
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  # Notificaciones por correo. Importa credenciales y workflows al arrancar.
  fact-n8n:
    image: ${DOCKERHUB_NAMESPACE}/facturacion-n8n:latest

    volumes:
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
      - facturacion_n8n_data:/home/node/.n8n

    networks:
      - hesegonet

    environment:
      - TZ=America/Bogota
      - GENERIC_TIMEZONE=America/Bogota
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=fact-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_HOST=fact-n8n
      - WEBHOOK_URL=http://fact-n8n:5678/
      - N8N_SECURE_COOKIE=false
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_RUNNERS_ENABLED=true
    ## Los workflows leen estas variables con $env (enlaces, remitente y token)
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - APP_URL=https://facturacion.devops.hesegoingenieria.com
      - MAIL_FROM=${MAIL_FROM:-Gastos Hesego <gastos@hesegoingenieria.com>}
      - N8N_WEBHOOK_TOKEN=${N8N_WEBHOOK_TOKEN}
    ## Credenciales que crea importar.sh
      - GASTOS_DB_HOST=fact-db
      - GASTOS_N8N_PASSWORD=${GASTOS_N8N_PASSWORD}
    ## ✉️ SMTP de Microsoft 365 (requiere SMTP AUTH habilitado para el buzón)
      - SMTP_HOST=${SMTP_HOST:-smtp.office365.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}

    deploy:
      mode: replicated
      replicas: 1
      restart_policy:
        condition: on-failure
        delay: 10s
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          cpus: "1"
          memory: 1024M

## --------------------------- FACTURACIÓN --------------------------- ##

volumes:
  facturacion_db_data:
    name: facturacion_db_data
  facturacion_minio_data:
    name: facturacion_minio_data
  facturacion_n8n_data:
    name: facturacion_n8n_data

networks:
  hesegonet:
    name: hesegonet
    external: true
